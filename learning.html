<div class="ask-panel" id="askPanel"><div class="ask-head"><div><strong id="askTitle">Ask about this exercise</strong><span id="askContext">Questions use the current key, chord and screen.</span></div><button class="ask-close" onclick="toggleAsk()">x</button></div><div class="ask-prompts" id="askPrompts"></div><div class="ask-input"><input id="askInput" placeholder="Ask about this chord, pattern or key..."><button class="pill" onclick="fakeAsk()">Ask</button></div><div class="ask-reply" id="askReply"></div></div>
<script>
const KEYS={C:{r:0,sig:'none',fam:['C','F','G','Am']},G:{r:7,sig:'1 sharp: F#',fam:['G','C','D','Em']},D:{r:2,sig:'2 sharps: F#, C#',fam:['D','G','A','Bm']},A:{r:9,sig:'3 sharps: F#, C#, G#',fam:['A','D','E','F#m']},E:{r:4,sig:'4 sharps: F#, C#, G#, D#',fam:['E','A','B','C#m']},B:{r:11,sig:'5 sharps: F#, C#, G#, D#, A#',fam:['B','E','F#','G#m']},F:{r:5,sig:'1 flat: Bb',fam:['F','Bb','C','Dm']},Bb:{r:10,sig:'2 flats: Bb, Eb',fam:['Bb','Eb','F','Gm']},Eb:{r:3,sig:'3 flats: Bb, Eb, Ab',fam:['Eb','Ab','Bb','Cm']},Ab:{r:8,sig:'4 flats: Bb, Eb, Ab, Db',fam:['Ab','Db','Eb','Fm']},Db:{r:1,sig:'5 flats: Bb, Eb, Ab, Db, Gb',fam:['Db','Gb','Ab','Bbm']}};
const PROGS=[{n:'Classic cadence',r:'I - IV - V - I',s:'Pop, folk and traditional music',d:[0,3,4,0]},{n:'Pop anthem',r:'I - V - vi - IV',s:'Modern pop and rock',d:[0,4,5,3]},{n:'50s progression',r:'I - vi - IV - V',s:'Doo-wop, pop and rock-and-roll',d:[0,5,3,4]},{n:'Jazz resolution',r:'ii7 - V7 - Imaj7',s:'Essential jazz cadence',c:['Dm7','G7','Cmaj7']},{n:'Jazz turnaround',r:'Imaj7 - vi7 - ii7 - V7',s:'Standards and jazz endings',c:['Cmaj7','Am7','Dm7','G7']},{n:'12-bar blues',r:'I7 - IV7 - I7 - I7 / IV7 - IV7 - I7 - I7 / V7 - IV7 - I7 - V7',s:'Blues and early rock',c:['C7','F7','C7','C7','F7','F7','C7','C7','G7','F7','C7','G7']}];
const NOTE=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'],INT=[0,2,4,5,7,9,11],TYPE=['','m','m','','','m','dim'];let st={screen:'hub',prev:'hub',key:'C',prog:1,chord:0,cadence:0,invTab:'Common notes',bass:'Root note pulse',dom:0,mode:'Mixolydian',passing:0,playInv:0};
const NOTESET={C:['C','E','G'],G:['G','B','D'],Am:['A','C','E'],F:['F','A','C'],Dm:['D','F','A'],Dm7:['D','F','A','C'],G7:['G','B','D','F'],Cmaj7:['C','E','G','B'],Am7:['A','C','E','G'],C7:['C','E','G','Bb'],F7:['F','A','C','Eb'],E7:['E','G#','B','D'],A7:['A','C#','E','G'],D7:['D','F#','A','C'],Bb:['Bb','D','F'],Eb:['Eb','G','Bb'],Em:['E','G','B']};
function n(pc){return NOTE[(pc+12)%12]}function chordDeg(k,d){return n(KEYS[k].r+INT[d])+TYPE[d]}function chords(p=PROGS[st.prog],k=st.key){if(p.c&&k==='C')return p.c;if(p.c)return p.c;return p.d.map(d=>chordDeg(k,d))}function pcOf(x){return {C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11}[x]}function isBlack(nm){return nm.length>1}function toneName(i){return i===0?'root':i===1?'third':i===2?'fifth':'extra'}function toneCls(i){return ' tone-'+toneName(i)}function notes(c){if(NOTESET[c])return NOTESET[c];let dim=c.match(/^([A-G](?:#|b)?)dim$/);if(dim&&pcOf(dim[1])!=null){let r=pcOf(dim[1]);return[n(r),n(r+3),n(r+6)]}let min7=c.match(/^([A-G](?:#|b)?)m7$/);if(min7&&pcOf(min7[1])!=null){let r=pcOf(min7[1]);return[n(r),n(r+3),n(r+7),n(r+10)]}let dom=c.match(/^([A-G](?:#|b)?)7$/);if(dom&&pcOf(dom[1])!=null){let r=pcOf(dom[1]);return[n(r),n(r+4),n(r+7),n(r+10)]}let clean=c.replace('maj7','').replace('m7','m').replace('7',''),hit=NOTESET[clean];if(hit)return hit;let m=clean.match(/^([A-G](?:#|b)?)(m?)/);if(!m||pcOf(m[1])==null)return[c,'3rd','5th'];let r=pcOf(m[1]),minor=m[2]==='m';return[n(r),n(r+(minor?3:4)),n(r+7)]}function toneFor(ns,note){let pc=pcOf(note),idx=ns.findIndex(x=>pcOf(x)===pc);return idx<0?null:{note:ns[idx],tone:idx}}function rootedNotes(root,count){let r=pcOf(root),out=[];for(let i=0;i<count;i++)out.push(n(r+i));return out}function rootedCells(root,count,active,mini=false,opts={}){let rootPc=pcOf(root),h=`<div class="${mini?'mini-keyboard':'keyboard rooted-keyboard'}">`;rootedNotes(root,count).forEach((note,i)=>{let pc=(rootPc+i)%12,a=active.byIndex?active[i]:active[pc],use=a&&(!a.limit||i<a.limit),label=use?a.label:(opts.hideAfter!=null&&i>=opts.hideAfter?'':note),cls=(mini?'mini-key':'rkey')+(isBlack(note)?' black-key':'')+(use?' '+a.cls:'');h+=`<div class="${cls}">${label}</div>`});return h+'</div>'}function voiced(ns,start){let last=-1,out=[];for(let i=0;i<3;i++){let tone=(start+i)%3,note=ns[tone],v=pcOf(note);while(v<=last)v+=12;last=v;out.push({note,val:v,tone})}return out}function miniKeyboard(order,root){let base=order[0].note,baseVal=order[0].val,active={byIndex:true};order.forEach((x,i)=>{let rel=x.val-baseVal;while(rel<0)rel+=12;active[rel]={label:x.note,cls:toneCls(x.tone)+(i===0?' bass':'')}});return rootedCells(base,13,active,true)}function voicingOrder(c,i){let ns=notes(c).slice(0,3);return voiced(ns,i||0)}function voicingKeyboard(order){let base=order[0].note,baseVal=order[0].val,active={byIndex:true};order.forEach((x,i)=>{let rel=x.val-baseVal;while(rel<0)rel+=12;active[rel]={label:x.note,cls:toneCls(x.tone)+(i===0?' bass':'')}});return rootedCells(base,13,active,false)}function toneNotes(order){return order.map(x=>'<span class="tone-note '+toneName(x.tone)+'">'+x.note+'</span>').join('')}function voicingPanel(c,interactive=false){let ns=notes(c).slice(0,3),rows=[['Root position',voiced(ns,0)],['1st inversion',voiced(ns,1)],['2nd inversion',voiced(ns,2)]];return '<div class="voicing-row">'+rows.map((row,i)=>{let tag=interactive?'button':'div',click=interactive?' onclick="pickPlayInv('+i+')"':'',active=interactive&&i===st.playInv?' active':'';return '<'+tag+' class="voicing'+active+'"'+click+'><strong>'+row[0]+' '+toneNotes(row[1])+'</strong>'+miniKeyboard(row[1],ns[0])+'<em>'+row[1][0].note+' in the bass</em></'+tag+'>'}).join('')+'</div>'}function signatureText(key){let map={C:'<em>none</em>',G:'<em>F#</em>',D:'<em>F# C#</em>',A:'<em>F# C# G#</em>',E:'<em>F# C# G# D#</em>',B:'<em>F# C# G# D# A#</em>',F:'<em>Bb</em>',Bb:'<em>Bb Eb</em>',Eb:'<em>Bb Eb Ab</em>',Ab:'<em>Bb Eb Ab Db</em>',Db:'<em>Bb Eb Ab Db Gb</em>'};return map[key]||'<em>shown here</em>'}function titleName(x){return x.replace(/\bminor\b/,'Minor').replace(/\bmajor\b/,'Major')}function relativeMinorChord(key){return KEYS[key].fam[3]||'Am'}function relativeMinorName(key){return relativeMinorChord(key).replace(/m$/,' minor')}function relativeMinorTitle(key){return titleName(relativeMinorName(key))}
function signatureVisual(key){let marks={C:[],G:['#'],D:['#','#'],A:['#','#','#'],E:['#','#','#','#'],B:['#','#','#','#','#'],F:['b'],Bb:['b','b'],Eb:['b','b','b'],Ab:['b','b','b','b'],Db:['b','b','b','b','b']}[key]||[];let sharpTops=[8,28,4,24,44],flatTops=[30,10,38,18,48];let html='<i></i><i></i><i></i><i></i><i></i><span class="sig-clef">𝄞</span>';marks.forEach(function(m,i){let top=(m==='#'?sharpTops:flatTops)[i]||10;html+='<span class="sig-mark" style="left:'+(66+i*19)+'px;top:'+top+'px">'+m+'</span>'});return html}function screenHead(t,l){return `<div class="screen-head"><div><p class="eyebrow">Learning Mode</p><h2 class="title">${t}</h2>${l?`<p class="lede">${l}</p>`:''}</div>${st.screen==='hub'?'':`<button class="pill ghost" onclick="backScreen()">Back</button>`}</div>`}
function familyCards(){let k=KEYS[st.key], labels=['I','IV','V','vi'], roles=['Tonic','Subdominant','Dominant','Relative minor'];document.getElementById('familyGrid').innerHTML=labels.map((r,i)=>`<div class="family ${r==='vi'?'minor':''}"><div class="chord-line"><div class="roman">${r}</div><div class="chord">${k.fam[i]}</div></div><div class="role">${roles[i]}</div></div>`).join('')}
function progRomans(p){let map=['I','ii','iii','IV','V','vi','vii°'];if(p.d)return p.d.map(d=>map[d]);return p.r.replace(/\s*\/\s*/g,' - ').split(/\s*-\s*/).map(x=>x.trim()).filter(Boolean).slice(0,12)}function progCard(p,i){let cs=chords(p).slice(0,12),rs=progRomans(p);return `<button class="prog ${i===st.prog?'active':''}" onclick="pickProg(${i})"><div class="prog-head"><strong>${p.n}</strong><span>${p.r}</span></div><div class="chips">${cs.map((x,j)=>`<span class="chip"><small>${rs[j]||''}</small>${x}</span>`).join('')}</div><p class="caption">${p.s}</p></button>`}
function progList(){return `<div class="scroll-box"><div class="prog-row">${PROGS.map(progCard).join('')}</div></div>`}
function stepCards(cs,rs=[]){return `<div class="steps">${cs.slice(0,4).map((c,i)=>`<button class="step ${i===st.chord?'active':''}" onclick="pickChord(${i})"><span class="ord">${i+1}</span>${rs[i]?`<div class="roman-tag">${rs[i]}</div>`:''}<div class="sym">${c}</div><div class="notes">${notes(c).join(' ')}</div></button>`).join('')}</div>`}
function keyboard(c,extra={},opts={}){let set=notes(c),active={};set.forEach((note,i)=>active[pcOf(note)]={label:note,cls:toneCls(i)+(extra[note]?' '+extra[note]:''),limit:12});Object.keys(extra).forEach(note=>{let pc=pcOf(note);if(active[pc])active[pc].cls+=' '+extra[note];else active[pc]={label:note,cls:extra[note],limit:12}});return rootedCells(set[0],13,active,false)}function bassKeyboard(c,pattern){let ns=notes(c),root=ns[0],active={};function mark(i,cls,label){active[pcOf(ns[i])]={label:label||ns[i],cls,limit:12}}if(pattern==='Root note pulse'){mark(0,'tone-root bass',`Root ${ns[0]}`)}else if(pattern==='Root + fifth'){mark(0,'tone-root bass',`Root ${ns[0]}`);mark(2,'tone-fifth',`5th ${ns[2]}`)}else if(pattern==='Broken bass'){mark(0,'tone-root bass',`1 ${ns[0]}`);mark(2,'tone-fifth',`2/4 ${ns[2]}`);mark(1,'tone-third',`3 ${ns[1]}`)}else{ns.forEach((note,i)=>active[pcOf(note)]={label:note,cls:toneCls(i)+(i===0?' bass':''),limit:12})}return rootedCells(root,24,active,false,{hideAfter:12})}function bassSteps(c,pattern){let ns=notes(c),root=ns[0],third=ns[1],fifth=ns[2],steps=pattern==='Broken bass'?[['1 Root',root],['2 Fifth',fifth],['3 Third',third],['4 Fifth again',fifth]]:pattern==='Root + fifth'?[['1 Root',root],['2 Fifth',fifth]]:pattern==='Ballad split'?[['1 Bass root',root],['2 Chord answers',c]]:[['Root',root],['repeat',root]];return `<div class="chips">${steps.map(x=>`<span class="chip"><small>${x[0]}</small>${x[1]}</span>`).join('')}</div>`}function keyScale(key){let root=KEYS[key].r;return INT.map(x=>n(root+x))}function scaleKeyboard(key){let root=KEYS[key].r,active={byIndex:true};INT.concat(12).forEach((step,i)=>{let cls=i===0||step===12?'tone-root':i===2?'tone-third':i===4?'tone-fifth':'scale-note';active[step]={label:n(root+step),cls}});return rootedCells(key,13,active,false)}function toneLegend(){return '<div class="tone-legend"><span><i class="tone-swatch root"></i>Root</span><span><i class="tone-swatch third"></i>3rd</span><span><i class="tone-swatch fifth"></i>5th</span></div>'}function keyScaleMarkup(key){return keyScale(key).map((note,i)=>`<span class="scale-note-name ${i===0?'root':i===2?'third':i===4?'fifth':''}">${note}</span>`).join('')}function renderKeyKeyboard(){document.getElementById('keyKeyboard').innerHTML=`${scaleKeyboard(st.key)}<div><div class="key-map-title"><span>${st.key} major scale</span><span>${keyScaleMarkup(st.key)}</span></div>${toneLegend()}</div>`}
function hub(){return `<section class="section" style="margin-top:0"><div class="section-head"><span class="section-name">Activities</span><span class="section-note">Click to test</span></div><div class="grid3"><button class="action" onclick="go('play')"><strong>Play a progression</strong><p>Choose a progression, step through each chord, and see one keyboard view update.</p></button><button class="action" onclick="go('cadence')"><strong>Cadences</strong><p>Hear how progressions pause, finish, or keep moving.</p></button><button class="action" onclick="go('inv')"><strong>Inversions</strong></button><button class="action" onclick="go('bass')"><strong>Bass patterns</strong><p>Try root note pulse, root + fifth, broken bass and ballad split.</p></button><button class="action" onclick="go('rhythm')"><strong>Rhythms</strong><p>Compare the most common comping rhythms before adding chord colour.</p></button><button class="action" onclick="go('passing')"><strong>Passing chords</strong><p>Use leading-tone, diminished, ii-V-I and substitution moves between chords.</p></button><button class="action" onclick="go('dom')"><strong>Secondary dominants</strong><p>Try E7 to Am, A7 to Dm and D7 to G.</p></button><button class="action" onclick="go('modes')"><strong>Modes</strong><p>Use modes as colour cards over a chord bed.</p></button></div></section><section class="section"><div class="section-head"><span class="section-name">Progressions</span><span class="section-note">All shown</span></div>${progList()}</section>`}function minorPage(){let m=relativeMinorChord(st.key), fam={C:['Am','Dm','E','G'],G:['Em','Am','B','D'],D:['Bm','Em','F#','A'],A:['F#m','Bm','C#','E'],E:['C#m','F#m','G#','B'],B:['G#m','C#m','D#','F#'],F:['Dm','Gm','A','C'],Bb:['Gm','Cm','D','F'],Eb:['Cm','Fm','G','Bb'],Ab:['Fm','Bbm','C','Eb'],Db:['Bbm','Ebm','F','Ab']}[st.key]||[m,'iv','V','VII'], romans=['i','iv','V','VII'], roles=['Tonic minor','Subdominant minor','Dominant','Subtonic'];return screenHead(relativeMinorName(st.key),'The relative minor shares the same key signature as '+st.key+' major, but centres the music on '+m+'.')+`<section class="section" style="margin-top:0"><div class="info"><strong>Minor has three forms.</strong><br>Natural minor, harmonic minor and melodic minor each create different sounds. Start with natural minor for the basic key map; the major V chord is shown because it is the most common dominant sound in minor-key progressions.</div></section><section class="section"><div class="section-head"><span class="section-name">Minor Key Family</span><span class="section-note">Shared Signature</span></div><div class="family-grid">${fam.map((c,i)=>`<div class="family minor"><div class="roman">${romans[i]}</div><div class="chord">${c}</div><div class="role">${roles[i]}</div></div>`).join('')}</div></section><section class="section"><div class="kbd-card"><div class="kbd-title"><strong>${m}</strong><span>${notes(m).join(' ')}</span></div>${keyboard(m,{}, {octaves:2})}</div></section>`}
function play(){let p=PROGS[st.prog],cs=chords(p),c=cs[st.chord%cs.length],inv=st.playInv||0,order=voicingOrder(c,inv),names=['Root position','1st inversion','2nd inversion'];return screenHead('Progression practice','')+'<div class="practice-grid"><div><section class="section" style="margin-top:0"><div class="section-head"><span class="section-name">'+p.n+'</span><span class="section-note">'+p.r+'</span></div>'+stepCards(cs,progRomans(p))+'</section><section class="section"><div class="kbd-card"><div class="kbd-title"><strong>'+c+'</strong><span>'+names[inv]+': '+order.map(x=>x.note).join(' ')+'</span></div>'+voicingKeyboard(order)+'</div><div class="toolbar"><button class="pill ghost" onclick="prevChord()">Previous</button><button class="pill" onclick="nextChord()">Next Chord</button></div>'+voicingPanel(c,true)+'</section></div><aside><div class="section-head"><span class="section-name">Progressions</span><span class="section-note">All shown</span></div><div class="scroll-box"><div>'+PROGS.map(progCard).join('')+'</div></div></aside></div>'}function cadences(){let k=st.key,rows=[['Perfect cadence','V - I','Finished sound',[chordDeg(k,4),chordDeg(k,0)],['V dominant','I tonic'],'The strongest full stop. In '+k+' major, the dominant resolves home to the tonic.'],['Plagal cadence','IV - I','Amen sound',[chordDeg(k,3),chordDeg(k,0)],['IV subdominant','I tonic'],'Softer resolution. Often feels warm, hymn-like, or settled without as much pull as V - I.'],['Imperfect cadence','I - V','Question mark',[chordDeg(k,0),chordDeg(k,4)],['I tonic','V dominant'],'Ends on the dominant, so it feels open and wants to continue.'],['Interrupted cadence','V - vi','Surprise turn',[chordDeg(k,4),chordDeg(k,5)],['V dominant','vi relative minor'],'The ear expects I, but lands on vi instead. Useful for emotional lift or delay.']];let sel=rows[st.cadence]||rows[0];return screenHead('Cadences','')+`<section class="section" style="margin-top:0"><div class="section-head"><span class="section-name">Cadences in ${k} Major</span><span class="section-note">A cadence is the chord ending that makes music feel finished, paused, open, or surprised.</span></div><div class="grid4">${rows.map((r,i)=>`<button class="rhythm-card cadence-card ${i===st.cadence?'active':''}" onclick="pickCadence(${i})"><strong>${r[0]}</strong><div class="chips"><span class="chip"><small>${r[1]}</small>${r[3][0]}</span><span class="chip">${r[3][1]}</span></div><p><b>${r[2]}.</b> ${r[5]}</p></button>`).join('')}</div></section><section class="section"><div class="section-head"><span class="section-name">Keyboard View</span><span class="section-note">${sel[3][0]} to ${sel[3][1]}</span></div><div class="grid2"><div class="kbd-card"><div class="kbd-title"><strong>${sel[3][0]}</strong><span>${sel[4][0]}</span></div>${keyboard(sel[3][0],{}, {octaves:2})}</div><div class="kbd-card"><div class="kbd-title"><strong>${sel[3][1]}</strong><span>${sel[4][1]}</span></div>${keyboard(sel[3][1],{}, {octaves:2})}</div></div></section>`}function inv(){let cs=chords(PROGS[1]),c=cs[st.chord%cs.length];return screenHead('Inversions','')+`<section class="section" style="margin-top:0">${stepCards(cs)}</section><section class="section"><div class="section-head"><span class="section-name">Root 1st 2nd</span><span class="section-note">Triad tones</span></div><div class="inversion-legend">${toneLegend()}</div>${voicingPanel(c)}</section>`}
function bass(){let cs=chords(PROGS[1]),c=cs[st.chord],ns=notes(c),root=ns[0],fifth=ns[2],third=ns[1];let patterns={'Root note pulse':['Just the root note',`${root} only`,`Play ${root} at the start of each chord. Common options: beat 1 only, beats 1 and 3, or steady quarter-note pulses.`],'Root + fifth':['Root and fifth only',`${root} and ${fifth}`,`Most common: alternate 1 - 5, play both together as a power fifth, or use 1 - 5 - 1.`],'Broken bass':['Broken chord in the bass',`${root} - ${fifth} - ${third} - ${fifth}`,`Most common: 1 - 5 - 3 - 5, 1 - 5 - 8 - 5, or a rolling 1 - 3 - 5 pattern.`],'Ballad split':['Bass first, chord answers',`${root} then ${c}`,`Most common: root on beat 1, chord on beat 2 or 3; repeat for each chord change.`]};let p=patterns[st.bass]||patterns['Root note pulse'];return screenHead('Bass patterns','')+`<section class="section"><div class="section-head"><span class="section-name">Left Hand Pattern</span><span class="section-note">Click One</span></div><div class="grid4">${Object.keys(patterns).map(x=>`<button class="small-option ${x===st.bass?'active':''}" onclick="pickBass('${x}')"><strong>${x}</strong><span>${patterns[x][0]}</span></button>`).join('')}</div></section><section class="section"><div class="section-head"><span class="section-name">${st.bass}</span><span class="section-note">${PROGS[1].r}</span></div>${stepCards(cs)}</section><section class="section"><table class="table"><tr><th>Chord</th><th>Keyboard Shows</th><th>How To Play It</th></tr><tr><td>${c}</td><td>${p[1]}</td><td>${p[2]}</td></tr></table><div class="caption">Play order</div>${bassSteps(c,st.bass)}</section><section class="section"><div class="kbd-card"><div class="kbd-title"><strong>${c}</strong><span>${st.bass}</span></div>${bassKeyboard(c,st.bass)}</div></section>`}
function rhythms(){let rows=[['Straight quarter chords','Hit every beat: 1 2 3 4. Good for learning changes before adding groove.',['1','2','3','4'],[0,1,2,3]],['Backbeat push','Hit 1, 2-and, 4. Common in pop because it feels forward without being too busy.',['1','&','2','&','3','&','4','&'],[0,3,6]],['Syncopated pop push','Hit 1, the and of 2, and the and of 4. Useful for modern pop, worship and singer-songwriter progressions.',['1','&','2','&','3','&','4','&'],[0,3,7]],['Anticipated change','Play the next chord on the and of 4 before the bar changes. This is a common way to make progressions flow.',['1','&','2','&','3','&','4','&'],[0,7]],['Ballad split','Bass first, chord after. Count bass on 1, chord on 2 or 3.',['1 bass','2 chord','3 chord','4 rest'],[0,1,2]],['Broken rhythm','Break the chord into smaller hits instead of one block. Try root, chord, chord, chord.',['root','chord','chord','chord'],[0,1,2,3]]];return screenHead('Rhythms','')+`<section class="section" style="margin-top:0"><div class="section-head"><span class="section-name">Common Rhythm Shapes</span><span class="section-note">Discussion mockup</span></div><div class="info"><strong>Purpose:</strong> rhythm decides when the chord is played. Keep the harmony simple first, then choose a rhythm that matches the song style.</div></section><section class="section"><div class="rhythm-grid">${rows.map(r=>`<div class="rhythm-card"><strong>${r[0]}</strong><div class="count-line">${r[2].map((x,i)=>`<span class="count ${r[3].includes(i)?'hit':''}">${x}</span>`).join('')}</div><div class="rhythm-controls"><button class="metro-btn">Metronome</button><div class="tempo-set"><span class="tempo">60</span><span class="tempo active">80</span><span class="tempo">100</span><span class="tempo">120</span></div></div><p>${r[1]}</p></div>`).join('')}</div></section><section class="section"><div class="section-head"><span class="section-name">Design Decisions</span><span class="section-note">Agreed direction</span></div><tab
